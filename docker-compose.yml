services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_local
      POSTGRES_DB: nexo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nexo_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexo']
      interval: 5s
      retries: 10
volumes:
  nexo_data:

